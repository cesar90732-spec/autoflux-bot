server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: qualquer rota que não seja um arquivo estático
    # cai no index.html, deixando o React Router assumir o roteamento.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html NUNCA pode ficar em cache: é ele que aponta pros
        # arquivos JS/CSS com hash. Se o navegador guardar uma versão
        # antiga dele, ele vai tentar carregar arquivos que não existem
        # mais depois de um novo deploy — e a página trava em branco.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache agressivo para assets com hash no nome (gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
